name: PulseWatch monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulsewatch-monitor
  cancel-in-progress: false

jobs:
  run-checks:
    name: Run due monitor checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger PulseWatch checks
        env:
          PULSEWATCH_APP_URL: ${{ vars.PULSEWATCH_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node <<'NODE'
          const baseUrl = process.env.PULSEWATCH_APP_URL;
          const cronSecret = process.env.CRON_SECRET;

          if (!baseUrl || !cronSecret) {
            console.error("Missing PULSEWATCH_APP_URL repository variable or CRON_SECRET repository secret.");
            process.exit(1);
          }

          const endpoint = new URL("/api/internal/run-checks", baseUrl);
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 240_000);

          fetch(endpoint, {
            method: "POST",
            headers: {
              authorization: `Bearer ${cronSecret}`,
            },
            signal: controller.signal,
          })
            .then(async (response) => {
              const body = await response.text();
              console.log(`Monitoring endpoint status: ${response.status}`);
              if (body) console.log(`Monitoring endpoint response: ${body}`);
              if (!response.ok) {
                console.error("PulseWatch monitoring endpoint returned an unsuccessful response.");
                process.exit(1);
              }
            })
            .catch((error) => {
              console.error(
                `PulseWatch monitoring request failed: ${error instanceof Error ? error.message : String(error)}`,
              );
              process.exit(1);
            })
            .finally(() => clearTimeout(timeout));
          NODE
